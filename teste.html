<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste</title>
<style>
body{font-family:sans-serif;padding:20px;background:#F4EDE1;color:#2B2B2B}
.screen{display:none}
.screen.on{display:block}
button{padding:16px 20px;font-size:16px;background:#2F4A3C;color:#fff;border:none;border-radius:12px;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<section class="screen on" id="s-welcome">
<h1>Um Livro com TDAH</h1>
<p>Teste de funcionamento</p>
<button onclick="go('s-ch1')">Começar minha jornada</button>
</section>
<section class="screen" id="s-ch1">
<h1>Capítulo 1</h1>
<p>Funcionou!</p>
<button onclick="go('s-welcome')">Voltar</button>
</section>
<script>
function go(id){
var all=document.querySelectorAll('.screen');
for(var i=0;i<all.length;i++){all[i].classList.remove('on');}
var el=document.getElementById(id);
if(el){el.classList.add('on');}
}
</script>
</body>
</html>
